<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="page-container">
      <!-- header -->
      <header class="header header-menu glass">
        <div class="container">
          <div class="nav-wrapper">
            <!-- logo -->
            <a href="../index.html" class="logo">
              <svg width="100" height="54">
                <use href="../image/sprite.svg#icon-logo-quiz-black"></use>
              </svg>
            </a>
            <!-- switch -->
            <div class="switch-wrapper">
              <div class="switch">
                <label class="switch">
                  <input type="checkbox" />
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="main">
        <!-- menu  -->
        <section class="hero">
          <div class="container">
            <div class="time glass">
              <p>Feb 1, 2025 Time:20:35</p>
            </div>
            <div class="menu-container glass">
              <h1 class="hero-title hero-title-menu menu-title">Menu</h1>
              <p>Chose your Quiz:</p>
              <ul class="menu-quiz-list">
                <li class="menu-quiz-item"><a href="">=></a></li>
              </ul>
            </div>
          </div>
        </section>
      </main>
      <!-- footer -->
      <footer class="footer footer-menu glass">
        <a href="./index.html" class="logo">
          <svg width="100" height="54">
            <use href="./image/sprite.svg#icon-logo-quiz-black"></use>
          </svg>
        </a>
      </footer>
    </div>
    <script src="../js/main.js" type="module"></script>
    <script src="../js/menu.js" type="module"></script>
    <!-- <script src="../js/registrationForm.js" type="module"></script> -->
  </body>
</html>
